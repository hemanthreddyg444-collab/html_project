<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - Annapoorna Seva</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->

  <main>
    <section class="section" id="contact">
      <h2>Contact Us</h2>
      <p class="centered">Have questions, ideas, or want to volunteer? Send us a message.</p>
      <div class="form-container">
        <h3>Send a Message</h3>
        <form id="contactForm">
          <label for="cname">Name</label>
          <input type="text" id="cname" name="name" placeholder="Your name" required minlength="2">

          <label for="cemail">Email</label>
          <input type="email" id="cemail" name="email" placeholder="your@email.com" required>

          <label for="cmsg">Message</label>
          <textarea id="cmsg" name="message" placeholder="Your message..." required minlength="10"></textarea>

          <button type="submit" class="btn-pill full-width">SEND MESSAGE</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer -->

</body>
</html>
